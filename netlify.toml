[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_BASE_URL = "https://api.briques.store/api/v1"
  VITE_WS_URL = "https://api.briques.store"
  VITE_APP_NAME = "BRIQUES.STORE Administration"
  VITE_APP_VERSION = "1.0.0"
  VITE_CDN_URL = "https://cdn.briques.store"

# SPA fallback - toutes les routes vers index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
